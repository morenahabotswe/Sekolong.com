import React from 'react';
import {
  ArrowRight,
  BookOpen,
  CalendarDays,
  CheckCircle2,
  ChevronRight,
  Download,
  FileText,
  GraduationCap,
  MessageCircle,
  PlayCircle,
  Plus,
  Settings,
  ShieldCheck,
  Sparkles,
  Users,
} from 'lucide-react';
import {classes,resources,subjects} from '../data/demo';
import {SectionTitle} from './Shell';
import type {User} from '../types';

export function StudentDashboard({user,onMosuoe,onNavigate}:{user:User;onMosuoe:()=>void;onNavigate:(route:string)=>void}){
  return (
    <>
      <div className="mb-7">
        <p className="eyebrow">GOOD MORNING, {user.name.split(' ')[0].toUpperCase()} 👋</p>
        <h1 className="mt-1 text-3xl font-extrabold text-ink">{user.language==='st'?'Re ithuta eng kajeno?':'What are we learning today?'}</h1>
      </div>

      <button onClick={onMosuoe} className="ask-card">
        <div>
          <p className="text-xs font-bold uppercase tracking-widest text-mist">Mosuoe o teng</p>
          <h2 className="mt-1 text-2xl font-extrabold">ASK MOSOUE</h2>
          <p className="mt-1 text-sm text-mist">Your digital teacher is ready to help</p>
        </div>
        <div className="mosuoe-avatar">M</div>
        <ArrowRight />
      </button>

      <section className="mt-8">
        <SectionTitle action="View all" onAction={()=>onNavigate('learn')}>Continue learning</SectionTitle>
        <div className="grid gap-3 sm:grid-cols-2">
          {subjects.slice(0,2).map((s)=>(
            <div className="card" key={s.id}>
              <div className="mb-4 flex justify-between">
                <span className="subject-dot" style={{background:s.color}}/>
                <span className="text-sm font-bold text-slate-500">{s.progress}%</span>
              </div>
              <h3 className="font-bold text-ink">{s.name}</h3>
              <p className="text-sm text-slate-500">{s.course}</p>
              <div className="progress mt-4"><i style={{width:s.progress+'%',background:s.color}}/></div>
            </div>
          ))}
        </div>
      </section>

      <section className="mt-8">
        <SectionTitle>Upcoming class</SectionTitle>
        <div className="card flex items-center gap-4">
          <div className="date-tile"><CalendarDays size={20}/><b>16:00</b></div>
          <div className="flex-1">
            <h3 className="font-bold text-ink">{classes[0].subject}</h3>
            <p className="text-sm text-slate-500">{classes[0].date} · {classes[0].duration} min</p>
            <p className="text-xs text-slate-400">Teacher: {classes[0].teacher}</p>
          </div>
          <a className="text-aqua" href={classes[0].meetUrl} target="_blank" rel="noreferrer"><PlayCircle/></a>
        </div>
      </section>

      <section className="mt-8">
        <SectionTitle action="Library" onAction={()=>onNavigate('resources')}>Your resources</SectionTitle>
        <div className="grid gap-3 sm:grid-cols-3">
          {resources.map((r)=>(
            <div className="card" key={r.id}>
              <div className="flex items-start justify-between">
                <div className="resource-icon"><Download size={18}/></div>
                <span className="text-[10px] uppercase text-slate-400">{r.type}</span>
              </div>
              <h3 className="mt-4 text-sm font-bold text-ink">{r.title}</h3>
              <p className="mt-1 text-xs text-slate-500">{r.subject}</p>
            </div>
          ))}
        </div>
      </section>
    </>
  );
}

export function StudentLearnPage({user,onNavigate,onMosuoe}:{user:User;onNavigate:(route:string)=>void;onMosuoe:()=>void}){
  return (
    <div className="space-y-6">
      <div className="flex items-center justify-between">
        <div>
          <p className="eyebrow">LEARNING</p>
          <h1 className="text-3xl font-extrabold text-ink">My lessons</h1>
        </div>
        <button onClick={onMosuoe} className="primary-btn">Ask Mosuoe</button>
      </div>

      <div className="grid gap-4 md:grid-cols-2">
        {subjects.map((subject)=>(
          <div className="card" key={subject.id}>
            <div className="mb-4 flex items-center justify-between">
              <span className="flex items-center gap-2"><span className="subject-dot" style={{background:subject.color}}/> <b>{subject.name}</b></span>
              <span className="text-sm font-bold text-slate-500">{subject.progress}%</span>
            </div>
            <p className="text-sm text-slate-600">{subject.course}</p>
            <p className="mt-2 text-xs text-slate-400">Current topic: {subject.topic}</p>
            <div className="progress mt-4"><i style={{width:subject.progress+'%',background:subject.color}}/></div>
            <button onClick={()=>onNavigate('classes')} className="mt-4 inline-flex items-center gap-2 text-sm font-bold text-aqua">Open lesson <ChevronRight size={16}/></button>
          </div>
        ))}
      </div>
    </div>
  );
}

export function StudentClassesPage({user,onNavigate}:{user:User;onNavigate:(route:string)=>void}){
  return (
    <div>
      <p className="eyebrow">CLASSES</p>
      <h1 className="text-3xl font-extrabold text-ink">Your timetable</h1>
      <div className="mt-6 space-y-4">
        {classes.map((item)=>(
          <div key={item.id} className="card flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <p className="text-xs uppercase tracking-[0.2em] text-slate-400">Grade {item.grade}</p>
              <h3 className="text-xl font-bold text-ink">{item.subject}</h3>
              <p className="text-sm text-slate-500">{item.date} · {item.time} · {item.duration} min</p>
            </div>
            <div className="flex items-center gap-3">
              <span className="rounded-full bg-emerald-100 px-2 py-1 text-xs font-semibold text-emerald-700">{item.status}</span>
              <a href={item.meetUrl} target="_blank" rel="noreferrer" className="primary-btn small">Join</a>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

export function StudentProfilePage({user}:{user:User}){
  return (
    <div className="space-y-5">
      <div className="card">
        <p className="eyebrow">PROFILE</p>
        <h1 className="text-3xl font-extrabold text-ink">{user.name}</h1>
        <p className="mt-2 text-slate-500">{user.email} · Grade {user.grade}</p>
      </div>

      <div className="grid gap-4 md:grid-cols-3">
        <div className="card"><p className="text-xs uppercase text-slate-400">School</p><h3 className="mt-2 text-xl font-bold text-ink">{user.school}</h3></div>
        <div className="card"><p className="text-xs uppercase text-slate-400">Language</p><h3 className="mt-2 text-xl font-bold text-ink">{user.language === 'st' ? 'Sesotho' : 'English'}</h3></div>
        <div className="card"><p className="text-xs uppercase text-slate-400">Goals</p><h3 className="mt-2 text-xl font-bold text-ink">5 this term</h3></div>
      </div>
    </div>
  );
}

export function StudentResourcesPage({user,onNavigate}:{user:User;onNavigate:(route:string)=>void}){
  return (
    <div>
      <div className="mb-5 flex items-center justify-between">
        <div>
          <p className="eyebrow">RESOURCES</p>
          <h1 className="text-3xl font-extrabold text-ink">Study library</h1>
        </div>
        <button onClick={()=>onNavigate('learn')} className="secondary-btn">Back to lessons</button>
      </div>

      <div className="grid gap-4 md:grid-cols-3">
        {resources.map((resource)=>(
          <div key={resource.id} className="card">
            <div className="resource-icon"><FileText size={18}/></div>
            <h3 className="mt-4 text-lg font-bold text-ink">{resource.title}</h3>
            <p className="mt-2 text-sm text-slate-500">{resource.subject}</p>
            <p className="mt-1 text-xs uppercase text-slate-400">{resource.type}</p>
            <button className="mt-4 inline-flex items-center gap-2 text-sm font-bold text-aqua"><Download size={16}/> Download</button>
          </div>
        ))}
      </div>
    </div>
  );
}

export function TeacherDashboard({user,onNavigate,onMosuoe}:{user:User;onNavigate:(route:string)=>void;onMosuoe:()=>void}){
  return (
    <div className="space-y-6">
      <div className="mb-7">
        <p className="eyebrow">TEACHER WORKSPACE</p>
        <h1 className="mt-1 text-3xl font-extrabold text-ink">Welcome back, {user.name.split(' ')[0]}</h1>
      </div>

      <div className="grid gap-4 md:grid-cols-3">
        <div className="card"><div className="flex items-center justify-between"><Users size={20} className="text-aqua"/><span className="text-sm font-bold text-slate-500">128</span></div><p className="mt-4 text-lg font-bold text-ink">Students</p></div>
        <div className="card"><div className="flex items-center justify-between"><CalendarDays size={20} className="text-aqua"/><span className="text-sm font-bold text-slate-500">4</span></div><p className="mt-4 text-lg font-bold text-ink">Classes</p></div>
        <div className="card"><div className="flex items-center justify-between"><Sparkles size={20} className="text-aqua"/><span className="text-sm font-bold text-slate-500">96%</span></div><p className="mt-4 text-lg font-bold text-ink">Engagement</p></div>
      </div>

      <div className="card">
        <SectionTitle action="View all" onAction={()=>onNavigate('students')}>My students</SectionTitle>
        <div className="space-y-3">
          {[{name:'Lerato', progress:'84%'},{name:'Neo', progress:'73%'},{name:'Aphiwe', progress:'91%'}].map((student)=>(
            <div key={student.name} className="flex items-center justify-between rounded-2xl border border-slate-100 p-3">
              <div><p className="font-bold text-ink">{student.name}</p><p className="text-xs text-slate-500">Active this week</p></div>
              <span className="rounded-full bg-brand/10 px-2 py-1 text-xs font-bold text-brand">{student.progress}</span>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <button onClick={onMosuoe} className="primary-btn w-full">Start an AI lesson review</button>
      </div>
    </div>
  );
}

export function TeacherStudentsPage({user,onNavigate}:{user:User;onNavigate:(route:string)=>void}){
  return (
    <div>
      <p className="eyebrow">STUDENTS</p>
      <h1 className="text-3xl font-extrabold text-ink">Learner support</h1>
      <div className="mt-6 grid gap-4 md:grid-cols-2">
        {['Lerato', 'Neo', 'Aphiwe', 'Mpho'].map((name,index)=> (
          <div className="card" key={name}>
            <div className="flex items-center justify-between">
              <div>
                <p className="font-bold text-ink">{name}</p>
                <p className="text-xs text-slate-500">Grade {7 + index % 2}</p>
              </div>
              <CheckCircle2 className="text-emerald-500" size={18} />
            </div>
            <div className="progress mt-4"><i style={{width: 72 + index*8 + '%', background: '#00AEEF'}}/></div>
          </div>
        ))}
      </div>
    </div>
  );
}

export function AdminDashboard({user,onNavigate,onMosuoe}:{user:User;onNavigate:(route:string)=>void;onMosuoe:()=>void}){
  return (
    <div className="space-y-6">
      <div className="mb-7">
        <p className="eyebrow">ADMIN</p>
        <h1 className="mt-1 text-3xl font-extrabold text-ink">System overview</h1>
      </div>

      <div className="grid gap-4 md:grid-cols-3">
        <div className="card"><GraduationCap className="text-aqua"/><p className="mt-4 text-lg font-bold text-ink">1,248 learners</p></div>
        <div className="card"><Users className="text-aqua"/><p className="mt-4 text-lg font-bold text-ink">84 teachers</p></div>
        <div className="card"><ShieldCheck className="text-aqua"/><p className="mt-4 text-lg font-bold text-ink">99.8% uptime</p></div>
      </div>

      <div className="card">
        <SectionTitle action="Review" onAction={onMosuoe}>AI support queue</SectionTitle>
        <div className="space-y-3">
          {['New lesson plans','Teacher coverage','Resources sync'].map((item)=>(
            <div key={item} className="flex items-center justify-between rounded-2xl border border-slate-100 p-3">
              <span className="font-medium text-ink">{item}</span>
              <ArrowRight size={16} className="text-slate-400"/>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

export function SettingsPage({user,onNavigate}:{user:User;onNavigate:(route:string)=>void}){
  return (
    <div>
      <p className="eyebrow">SETTINGS</p>
      <h1 className="text-3xl font-extrabold text-ink">Account preferences</h1>
      <div className="mt-6 grid gap-4 md:grid-cols-2">
        <div className="card"><Settings size={20} className="text-aqua"/><p className="mt-4 text-lg font-bold text-ink">Notifications</p><p className="text-sm text-slate-500">Email and app alerts</p></div>
        <div className="card"><BookOpen size={20} className="text-aqua"/><p className="mt-4 text-lg font-bold text-ink">Learning preferences</p><p className="text-sm text-slate-500">Set language and pace</p></div>
      </div>
    </div>
  );
}

export function DashboardFallback(){ return null; }










































































































































































































































































































































